<html>
    <head>
        <script>
            function loadData(){
                var xhr = new XMLHttpRequest();
                xhr.onreadystatechange = function(){
                    document.getElementById("rs").innerHTML=this.readyState;
                    if(this.readyState == 4 && this.status==200){
                        var response = this.responseText;
                        var arr = JSON.parse(response);
                        var op="";
                        for (i=0;i<arr.length;i++){

                            var obj = arr[i];
                            tr = "<tr><td>"+obj.Id+"</td><td>"+
                                               obj.Name+"</td><td>"+
                                               obj.Address+"</td></tr>";
                            op+=tr;

                        }
                        document.getElementById("tB").innerHTML=op;
                        
                    }
                };
                xhr.open("GET","https://localhost:44373/api/student/all",true);
                xhr.send();

            }
        </script>
    </head>
    <body>
        <button onclick="loadData()">Load Data</button>
        <span id="rs"></span>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Address</th>
                </tr>
            </thead>
            <tbody id="tB">

            </tbody>
        </table>
    </body>
</html>
